# Purpose: Declarative YAML policy controlling ingestion security limits, encoding fallbacks, and M2/M3 privacy rules.
# RAKSHA Privacy & Ingestion Policy (v0.1.0-draft)
# Structure owned by Member 1; detection & privacy rules coordinated with Members 2 & 3.

version: "0.1.0"

ingestion:
  max_file_bytes: 52428800        # 50 MiB cap per file to stay safely within 4 GB RAM
  max_json_depth: 64              # Guard against deeply nested JSON DoS
  follow_symlinks: false          # Never follow symlinks outside or inside input root
  empty_file_action: "quarantine" # "quarantine" failed/0-byte files rather than copying raw/empty
  supported_extensions:
    - ".csv"
    - ".tsv"
    - ".json"
    - ".txt"
  csv_allowed_delimiters:
    - ","
    - ";"
    - "|"
  encoding_fallbacks:
    - "utf-8-sig"
    - "utf-8"
    - "utf-16"
    - "cp1252"
    - "iso-8859-1"

# Coordinated placeholders for Member 2 (Detection & Clinical Integrity)
detection:
  languages: ["en", "hi", "hinglish"]
  inspect_structured_keys: true
  inspect_filenames: true
  protect_clinical_spans: true

# Coordinated placeholders for Member 3 (Linkage, HMAC & Quasi-Identifiers)
privacy:
  pseudonym_prefix: "PSN-"
  hmac_algorithm: "sha256"
  abstain_on_conflict: true       # Export patient: null when identity is uncertain
  preserve_stay_duration: true    # Keep per-patient date shift consistent across records
  k_threshold: 3                  # Minimum equivalence-class size for detailed QIs
  age_band_width: 5               # Years per exported age band
  age_top_code: 90                # All ages at/above this value become "90+"
  date_shift_max_days: 180        # HMAC-derived non-zero shift range
  address_locality_k: 3           # Localities below this group size fall back to coarser geography
  merge_threshold: 0.8            # Minimum corroborated score needed to merge two records
  ambiguity_margin: 0.05          # Close competing candidates above the floor remain null
  singleton_policy: "assign"      # Give unmatched, non-conflicting patients their own PSN
  k_location: 5                   # Distinct patients required before retaining a locality
  household_shift: true           # Keep explicitly related same-day household events coherent
